<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時互動系統</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; background: #f5f5f5; text-align: center; }
    .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    input { width: 90%; padding: 15px; margin: 10px 0; font-size: 18px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; transition: 0.2s; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    input:disabled { background: #eee; cursor: not-allowed; }
    #step2 { display: none; }
    #statusMsg { font-weight: bold; margin-top: 15px; display: none; }
  </style>
</head>
<body>

  <div class="card" id="step1">
    <h2>輸入姓名進入活動</h2>
    <input type="text" id="nameInput" placeholder="請輸入姓名 / 暱稱">
    <button onclick="joinRoom()">進入</button>
  </div>

  <div class="card" id="step2">
    <!-- 🌟 將固定文字替換為帶有 ID 的標籤，初始顯示「載入中...」 -->
    <h2 id="questionTitle">載入中...</h2>
    <p>字數限制：20字以內</p>
    <input type="text" id="wordInput" placeholder="例如：實用" maxlength="20">
    <button id="submitBtn" onclick="submitWord()">送出</button>
    <p id="statusMsg"></p>
  </div>

  <script>
    const socket = io();
    let userName = "";
    let isRoomLocked = false;
    let isSingleSubmit = true;
    let hasSubmitted = false;

    // 🌟 接收並替換最新題目
    socket.on('update-title', (title) => {
      document.getElementById('questionTitle').innerText = title;
    });

    function joinRoom() {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) return alert("請輸入姓名！");
      userName = name;
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    }

    function submitWord() {
      const word = document.getElementById('wordInput').value.trim();
      if (!word) return alert("請輸入詞彙！");
      socket.emit('submit-word', { name: userName, word: word });
    }

    socket.on('submit-success', () => {
      hasSubmitted = true;
      document.getElementById('wordInput').value = "";
      updateUI();
      
      const msg = document.getElementById('statusMsg');
      msg.innerText = "✅ 已送出！請抬頭看大螢幕。";
      msg.style.color = "green";
      msg.style.display = "block";
      setTimeout(() => { 
        if(!isRoomLocked && (!isSingleSubmit || !hasSubmitted)) {
          msg.style.display = 'none'; 
        }
      }, 3000);
    });

    socket.on('submit-error', (errMsg) => { alert(errMsg); });
    socket.on('update-lock-status', (status) => { isRoomLocked = status; updateUI(); });
    socket.on('update-submit-mode', (status) => { isSingleSubmit = status; updateUI(); });
    socket.on('words-cleared', () => { hasSubmitted = false; updateUI(); });

    function updateUI() {
      const input = document.getElementById('wordInput');
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMsg');

      if (isRoomLocked) {
        input.disabled = true; btn.disabled = true;
        msg.innerText = "🔒 講師已暫停接收回答";
        msg.style.color = "#d9534f"; msg.style.display = 'block';
        input.placeholder = "房間已鎖定";
      } else if (isSingleSubmit && hasSubmitted) {
        input.disabled = true; btn.disabled = true;
        msg.innerText = "✅ 您已完成作答，等待下一題";
        msg.style.color = "#f0ad4e"; msg.style.display = 'block';
        input.placeholder = "已完成作答";
      } else {
        input.disabled = false; btn.disabled = false;
        msg.style.display = 'none';
        input.placeholder = "例如：實用";
      }
    }
  </script>
</body>
</html>
