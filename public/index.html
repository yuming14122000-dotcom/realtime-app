<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時互動系統</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; background: #f5f5f5; text-align: center; }
    .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    input { width: 90%; padding: 15px; margin: 10px 0; font-size: 18px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
    #step2 { display: none; }
  </style>
</head>
<body>
  <div class="card" id="step1">
    <h2>輸入姓名進入活動</h2>
    <input type="text" id="nameInput" placeholder="請輸入姓名 / 暱稱">
    <button onclick="joinRoom()">進入</button>
  </div>

  <div class="card" id="step2">
    <h2>一起來看看大家的想法</h2>
    <p>字數限制：10字以內</p>
    <input type="text" id="wordInput" placeholder="例如：實用" maxlength="10">
    <button id="submitBtn" onclick="submitWord()">送出</button>
    <p id="msg" style="color: green; margin-top: 15px; display: none;">已送出！請抬頭看大螢幕。</p>
  </div>

  <script>
    const socket = io();
    let userName = "";

    function joinRoom() {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) return alert("請輸入姓名！");
      userName = name;
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    }

    function submitWord() {
      const word = document.getElementById('wordInput').value.trim();
      if (!word) return alert("請輸入詞彙！");
      
      socket.emit('submit-word', { name: userName, word: word });
      
      document.getElementById('wordInput').value = "";
      document.getElementById('msg').style.display = 'block';
      setTimeout(() => { document.getElementById('msg').style.display = 'none'; }, 3000);
    }
  </script>
</body>
</html>
